<!doctype html>
<html lang="zh-CN" data-theme="system">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>移动灵犀登录</title><link rel="stylesheet" href="./page.css"><script type="module" src="./main.js"></script></head>
<body><main>
<section class="intro"><span class="eyebrow">LINGXI · 移动灵犀</span><h1>连接移动灵犀，<br>开始你的下一段对话</h1><p>通过短信登录保存账户，或导入已有的登录凭证。</p><ol><li>填写移动灵犀账户的手机号。</li><li>发送短信，按提示完成图形验证。</li><li>输入短信验证码，添加账户。</li></ol><span class="badge">凭证由当前 Agent2API 网关保存</span></section>
<section class="card" aria-label="添加移动灵犀账户">
<div class="tabs" role="tablist" aria-label="登录方式"><button id="sms-tab" type="button" role="tab" aria-selected="true" aria-controls="sms-panel">短信登录</button><button id="manual-tab" type="button" role="tab" aria-selected="false" aria-controls="manual-panel">Token 导入</button></div>
<label class="proxy">登录出网方式<select id="proxy-mode"><option value="gateway">使用网关出口</option><option value="direct">直连</option></select></label>
<div id="error" role="alert" hidden></div>
<section id="sms-panel" role="tabpanel" aria-labelledby="sms-tab"><form id="sms-form">
<label>手机号<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="11 位手机号" pattern="(?:\+86)?1[0-9]{10}" required></label>
<div id="captcha-panel" hidden><img id="captcha-image" alt="图形验证码"><label>图形验证码<input id="captcha-code" autocomplete="off" maxlength="16" placeholder="输入图片中的字符"></label></div>
<div class="actions"><button id="send" type="button" class="primary">发送短信验证码</button><button id="captcha" type="button">图形验证</button></div>
<label>短信验证码<input id="sms-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6 位短信验证码" required></label>
<label>备注名（可选）<input id="sms-name" maxlength="100" placeholder="我的移动灵犀账户" autocomplete="off"></label>
<button id="verify" type="submit" class="primary" disabled>登录并添加账户</button><button id="cancel" type="button" disabled>取消本次登录</button>
</form></section>
<section id="manual-panel" role="tabpanel" aria-labelledby="manual-tab" hidden><form id="manual-form">
<label>Access Token<input id="access-token" type="password" autocomplete="new-password" spellcheck="false" placeholder="移动灵犀官网的 access_token" required></label>
<label>Refresh Token（可选）<input id="refresh-token" type="password" autocomplete="new-password" spellcheck="false" placeholder="填写后可自动续期"></label>
<label>备注名（可选）<input id="manual-name" maxlength="100" autocomplete="off" placeholder="我的移动灵犀账户"></label><button id="import" type="submit" class="primary">验证并添加账户</button>
<p class="muted">使用移动灵犀官网的登录 Token，不是原工作台生成的 lx_ API Key。</p></form></section>
<p id="status" class="status" role="status" aria-live="polite">登录后，回到账户列表刷新模型目录。</p><p class="footnote">请仅登录你自己的账户。短信仅在点击发送时发出。</p>
</section></main></body></html>
